<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simplified 2D visual simulator of active noise cancellation using superposing sound wavefronts.">
  <title>2D Noise Cancellation Simulator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>2D Noise Cancellation Simulator</h1>
    <p class="subtitle">
      Red = compression (+) &nbsp;·&nbsp; Green = rarefaction (−) &nbsp;·&nbsp; overlap that cancels = background (silence)
    </p>
  </header>

  <div class="toolbar">
    <div class="group">
      <label class="toggle">
        <input id="alternate" type="checkbox" checked>
        Alternating polarity
      </label>
      <label class="toggle">
        <input id="wall" type="checkbox" checked>
        Wall
      </label>
    </div>
    <div class="group">
      <button class="mode active" data-mode="noise">Noise Source</button>
      <button class="mode" data-mode="node">Cancel Node</button>
      <button class="mode" data-mode="move">Move</button>
      <button class="mode" data-mode="delete">Delete</button>
    </div>
    <div class="group">
      <button id="btn-play" class="ctrl">⏸ Pause</button>
      <button id="btn-clear" class="ctrl">✕ Clear</button>
      <button id="btn-reset" class="ctrl">↺ Reset waves</button>
      <label class="speed">
        Speed
        <input id="speed" type="range" min="0.25" max="3" step="0.05" value="0.5">
        <span id="speed-val">0.50×</span>
      </label>
      <label class="speed">
        Frequency
        <input id="freq" type="range" min="100" max="2000" step="10" value="500">
        <span id="freq-val">500 Hz</span>
      </label>
      <label class="speed">
        Gap size
        <input id="gap" type="range" min="0.1" max="3" step="0.05" value="1">
        <span id="gap-val">1.00 m</span>
      </label>
      <label class="speed">
        Line width
        <input id="linewidth" type="range" min="4" max="60" step="1" value="30">
        <span id="linewidth-val">30 px</span>
      </label>
      <label class="speed">
        Cancel strength
        <input id="strength" type="range" min="0" max="1" step="0.01" value="1">
        <span id="strength-val">1.00</span>
      </label>
    </div>
  </div>

  <div id="canvas-wrap" class="canvas-wrap">
    <canvas id="canvas"></canvas>
    <div id="hint" class="hint">Click the canvas to place a noise source.</div>
  </div>

  <div class="legend">
    <span><i class="swatch sw-red"></i> Compression (+)</span>
    <span><i class="swatch sw-green"></i> Rarefaction (−)</span>
    <span><i class="swatch sw-black"></i> Cancelled → silence (background)</span>
  </div>

  <footer>
    <p>Theory &amp; caveats: <a href="physics-summary.md">physics-summary.md</a></p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
